<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="1210" rx="12" fill="#ffffff"/>

  <text x="30" y="34" font-size="15" font-weight="700" fill="#0f172a">Section B — json_to_pdl.py translator flow</text>

  <!-- input -->
  <rect x="240" y="56" width="250" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="365" y="79" font-size="13" fill="#1e293b" text-anchor="middle">extract_rules output</text>
  <text x="365" y="98" font-size="11" fill="#475569" text-anchor="middle">list[setpoint_record]</text>
  <line x1="365" y1="108" x2="365" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <!-- variable map load -->
  <rect x="215" y="132" width="300" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="365" y="156" font-size="13" fill="#1e293b" text-anchor="middle">load + validate variable_map.json</text>
  <text x="365" y="176" font-size="11" fill="#475569" text-anchor="middle">PV regex · collision check (B.2)</text>

  <!-- abort -->
  <rect x="20" y="140" width="150" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="95" y="158" font-size="11.5" fill="#991b1b" text-anchor="middle">map invalid:</text>
  <text x="95" y="175" font-size="11.5" fill="#991b1b" text-anchor="middle">abort run</text>
  <line x1="215" y1="162" x2="174" y2="162" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>

  <line x1="365" y1="192" x2="365" y2="212" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <!-- classification frame -->
  <rect x="200" y="216" width="330" height="264" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="210" y="236" font-size="11.5" font-style="italic" fill="#64748b">B.3 classification — atomic per record</text>

  <rect x="220" y="246" width="290" height="38" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="270" font-size="12.5" fill="#1e293b" text-anchor="middle">any MISSING_* field?</text>
  <line x1="365" y1="284" x2="365" y2="298" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>
  <text x="374" y="296" font-size="10" fill="#64748b">no</text>

  <rect x="220" y="302" width="290" height="38" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="326" font-size="12.5" fill="#1e293b" text-anchor="middle">conditions empty?</text>
  <line x1="365" y1="340" x2="365" y2="354" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>
  <text x="374" y="352" font-size="10" fill="#64748b">no</text>

  <rect x="220" y="358" width="290" height="38" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="382" font-size="12.5" fill="#1e293b" text-anchor="middle">any FORMULA leg?</text>
  <line x1="365" y1="396" x2="365" y2="410" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>
  <text x="374" y="408" font-size="10" fill="#64748b">no</text>

  <rect x="220" y="414" width="290" height="38" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="438" font-size="12.5" fill="#1e293b" text-anchor="middle">legs mixed null / named?</text>

  <!-- classification -> queue arrows -->
  <line x1="510" y1="265" x2="636" y2="265" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="259" font-size="10.5" fill="#b45309" text-anchor="middle">yes</text>
  <line x1="510" y1="321" x2="636" y2="321" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="315" font-size="10.5" fill="#b45309" text-anchor="middle">yes</text>
  <line x1="510" y1="377" x2="636" y2="377" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="371" font-size="10.5" fill="#b45309" text-anchor="middle">yes</text>
  <line x1="510" y1="433" x2="636" y2="433" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="427" font-size="10.5" fill="#b45309" text-anchor="middle">yes</text>

  <!-- shape split -->
  <polyline points="365,452 365,488 257,488 257,504" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <polyline points="365,452 365,488 475,488 475,504" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="257" y="482" font-size="10.5" fill="#64748b" text-anchor="middle">all null legs</text>
  <text x="475" y="482" font-size="10.5" fill="#64748b" text-anchor="middle">all named legs</text>

  <rect x="160" y="508" width="195" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="257" y="530" font-size="12.5" fill="#1e293b" text-anchor="middle">value path</text>
  <text x="257" y="549" font-size="11" fill="#475569" text-anchor="middle">one statement per leg</text>

  <rect x="375" y="508" width="200" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="475" y="530" font-size="12.5" fill="#1e293b" text-anchor="middle">multipleMatch path</text>
  <text x="475" y="549" font-size="11" fill="#475569" text-anchor="middle">one rn element per leg</text>

  <line x1="257" y1="562" x2="257" y2="588" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <line x1="475" y1="562" x2="475" y2="588" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <!-- per-leg frame -->
  <rect x="200" y="592" width="330" height="268" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="210" y="612" font-size="11.5" font-style="italic" fill="#64748b">per-leg pipeline (B.2 · B.5 · B.4)</text>

  <rect x="220" y="624" width="290" height="40" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="649" font-size="12" fill="#1e293b" text-anchor="middle">to_pv — variable name → P1.xxx</text>
  <line x1="365" y1="664" x2="365" y2="680" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>

  <rect x="220" y="684" width="290" height="40" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="709" font-size="11.5" fill="#1e293b" text-anchor="middle">parse_threshold → Decimal (sci-notation · commas)</text>
  <line x1="365" y1="724" x2="365" y2="740" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>

  <rect x="220" y="744" width="290" height="40" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="365" y="769" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">format_number — the Diego seam</text>
  <line x1="365" y1="784" x2="365" y2="800" stroke="#475569" stroke-width="1.4" marker-end="url(#arrGray)"/>

  <rect x="220" y="804" width="290" height="40" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="365" y="820" font-size="12" fill="#1e293b" text-anchor="middle">direction → operator</text>
  <text x="365" y="836" font-size="11" fill="#475569" text-anchor="middle">BELOW_MIN → &lt;&#160;&#160;&#160;ABOVE_MAX → &gt;</text>

  <!-- leg -> queue arrows -->
  <line x1="510" y1="644" x2="636" y2="644" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="638" font-size="10.5" fill="#b45309" text-anchor="middle">unmapped</text>
  <line x1="510" y1="704" x2="636" y2="704" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="698" font-size="10.5" fill="#b45309" text-anchor="middle">unparseable</text>
  <line x1="510" y1="764" x2="636" y2="764" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
  <text x="573" y="758" font-size="10.5" fill="#b45309" text-anchor="middle">negative</text>

  <!-- review queue frame -->
  <rect x="640" y="216" width="350" height="626" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="650" y="238" font-size="11.5" font-weight="700" fill="#92400e">REVIEW QUEUE — closed reason set (B.7)</text>

  <rect x="660" y="246" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="270" font-size="12" fill="#92400e" text-anchor="middle">MISSING_FIELD</text>
  <rect x="660" y="302" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="326" font-size="12" fill="#92400e" text-anchor="middle">EMPTY_CONDITIONS</text>
  <rect x="660" y="358" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="382" font-size="12" fill="#92400e" text-anchor="middle">FORMULA_THRESHOLD</text>
  <rect x="660" y="414" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="438" font-size="12" fill="#92400e" text-anchor="middle">MALFORMED_SHAPE</text>

  <text x="815" y="520" font-size="11" font-style="italic" fill="#92400e" text-anchor="middle">any hit queues the whole record —</text>
  <text x="815" y="538" font-size="11" font-style="italic" fill="#92400e" text-anchor="middle">never a partial emission</text>

  <rect x="660" y="625" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="649" font-size="12" fill="#92400e" text-anchor="middle">UNMAPPED_VARIABLE (+ suggested_pv)</text>
  <rect x="660" y="685" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="709" font-size="12" fill="#92400e" text-anchor="middle">UNPARSEABLE_THRESHOLD</text>
  <rect x="660" y="745" width="310" height="38" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="815" y="769" font-size="12" fill="#92400e" text-anchor="middle">NEGATIVE_THRESHOLD</text>

  <!-- statements + assembly -->
  <line x1="365" y1="860" x2="365" y2="880" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <rect x="240" y="884" width="250" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="365" y="909" font-size="12.5" fill="#1e293b" text-anchor="middle">statements + report rows</text>
  <line x1="365" y1="924" x2="365" y2="944" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <rect x="200" y="948" width="330" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="365" y="972" font-size="12.5" fill="#1e293b" text-anchor="middle">assemble (B.6): values first, then multipleMatch</text>
  <text x="365" y="992" font-size="11" fill="#475569" text-anchor="middle">sanitize /* comments */ · version header</text>

  <!-- convergence to invariant -->
  <polyline points="365,1010 365,1032 540,1032 540,1050" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <polyline points="815,842 815,1032 640,1032 640,1050" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>

  <rect x="430" y="1054" width="320" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="590" y="1076" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">invariant (B.0):</text>
  <text x="590" y="1096" font-size="12" fill="#1e293b" text-anchor="middle">translated + queued == records?</text>

  <rect x="790" y="1060" width="200" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="890" y="1078" font-size="12" fill="#991b1b" text-anchor="middle">AccountingError</text>
  <text x="890" y="1094" font-size="11" fill="#991b1b" text-anchor="middle">hard fail</text>
  <line x1="750" y1="1082" x2="786" y2="1082" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="766" y="1076" font-size="10.5" fill="#dc2626" text-anchor="middle">no</text>

  <line x1="590" y1="1110" x2="590" y2="1130" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="600" y="1126" font-size="10.5" fill="#64748b">yes</text>

  <!-- result -->
  <rect x="440" y="1134" width="300" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="590" y="1157" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">TranslationResult</text>
  <text x="590" y="1177" font-size="11" fill="#065f46" text-anchor="middle">pdl_text · queue · report</text>

  <rect x="790" y="1140" width="210" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="895" y="1158" font-size="12" fill="#065f46" text-anchor="middle">assert_parses</text>
  <text x="895" y="1175" font-size="11" fill="#065f46" text-anchor="middle">Python ANTLR target (B.9)</text>
  <line x1="740" y1="1162" x2="786" y2="1162" stroke="#475569" stroke-width="1.6" marker-end="url(#arrGray)"/>

  <!-- legend -->
  <rect x="30" y="1134" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="52" y="1145" font-size="11" fill="#475569">happy path</text>
  <rect x="30" y="1158" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="52" y="1169" font-size="11" fill="#475569">review queue</text>
  <rect x="170" y="1134" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="192" y="1145" font-size="11" fill="#475569">Diego seam (B.5)</text>
  <rect x="170" y="1158" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="192" y="1169" font-size="11" fill="#475569">outputs</text>
</svg>
